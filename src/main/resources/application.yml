spring:
  application:
    name: api-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

athar:
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:true}
    limit: ${RATELIMIT_LIMIT:60}
    keyed-limit: ${RATELIMIT_KEYED_LIMIT:600}
    window-seconds: ${RATELIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://openathar.org,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: false