spring:
  application:
    name: api-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

athar:
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:true}
    limit: ${RATELIMIT_LIMIT:60}
    window-seconds: ${RATELIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html